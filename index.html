<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeatMarket - Iniciar sesión</title>
    <link rel="preload" href="fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="pagina-login">
    <main class="login">

        <section class="login__marca" aria-label="BeatMarket">
            <div class="logo">
                <span class="logo__icono"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10h2v4H4zM8 6h2v12H8zM12 3h2v18h-2zM16 8h2v8h-2zM20 11h2v2h-2z"/></svg></span>
                BeatMarket
            </div>
            <div>
                <h2 class="login__titular">El mercado de beats para productores y artistas</h2>
                <p class="login__texto">Escucha un fragmento, elige tu licencia y compra. Los productores publican y administran su catálogo desde un solo panel.</p>
            </div>
            <div class="mosaico" id="mosaico" aria-hidden="true"></div>
        </section>

        <section class="login__panel">
            <form id="formLogin" class="login__form" novalidate>
                <h1>Iniciar sesión</h1>
                <p>Ingresa con tu correo y contraseña.</p>

                <div class="campo">
                    <label for="email">Correo</label>
                    <input type="email" id="email" name="email" autocomplete="username" placeholder="correo@ejemplo.com" required>
                </div>
                <div class="campo">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>

                <button type="submit" class="btn btn--primario btn--bloque" id="btnEntrar">Entrar</button>
                <p id="mensaje" class="mensaje-error" role="alert"></p>
            </form>

            <div class="roles-demo">
                <h2>Usuarios de prueba</h2>
                <ul id="listaRoles"></ul>
            </div>
        </section>

    </main>

    <script src="js/datos.js"></script>
    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
